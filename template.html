<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EigenKI</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef5ff;color:#132238;font:16px system-ui}main{max-width:820px;margin:auto;height:100dvh;background:white;display:flex;flex-direction:column}header{padding:20px;border-bottom:1px solid #dfe8f4;display:flex;align-items:center;gap:12px}strong{font-size:23px}small{display:block;color:#52677f;font-size:14px}.logo{background:#147cf1;color:white;border-radius:14px;padding:11px 17px;font-weight:800}#chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}.msg{max-width:90%;white-space:pre-wrap;line-height:1.6;padding:13px 17px;border-radius:18px;background:#edf4fd;align-self:flex-start}.user{background:#147cf1;color:white;align-self:flex-end}form{display:flex;gap:8px;padding:16px;border-top:1px solid #dfe8f4}textarea{resize:none;flex:1;min-width:0;border:1px solid #cddbef;border-radius:14px;padding:12px;font:inherit}button{border:0;border-radius:14px;background:#147cf1;color:white;padding:12px;font:inherit;cursor:pointer}button:disabled{opacity:.5}.note{padding:10px 20px;color:#53677f;font-size:14px;background:#f5f8fc}</style>
<main><header><div class="logo">E</div><div><strong>EigenKI</strong><small>Eigenes trainiertes Sprachmodell · Experiment</small></div></header><div class="note">Kleines Trainingsmodell: Antworten können unverständlich oder falsch sein.</div><section id="chat" aria-live="polite" aria-label="Chat"></section><form><textarea rows="2" maxlength="500" aria-label="Nachricht" placeholder="Schreib etwas …"></textarea><button>Senden</button></form></main>
<script id="weights" type="application/json">__MODEL__</script>
<script>
const model=JSON.parse(document.getElementById('weights').textContent), chars=model.chars, H=model.hidden;
const lookup=new Map(chars.map((c,i)=>[c,i])), history=[], chat=document.querySelector('#chat'), input=document.querySelector('textarea'), button=document.querySelector('button');
function state(h,x){return model.U.map((row,i)=>{let v=model.b[i]+model.W[i][x];for(let j=0;j<H;j++)v+=row[j]*h[j];return Math.tanh(v)})}
function sample(h){let z=model.O.map((row,i)=>{let v=model.c[i];for(let j=0;j<H;j++)v+=row[j]*h[j];return v});const max=Math.max(...z);const candidates=z.map((v,i)=>[i,Math.exp((v-max)/.65)]).sort((a,b)=>b[1]-a[1]).slice(0,8);let r=Math.random()*candidates.reduce((s,a)=>s+a[1],0);for(const [i,p]of candidates){r-=p;if(r<=0)return i}return candidates[0][0]}
async function generate(prompt){let h=Array(H).fill(0);for(const c of prompt){const x=lookup.get(c);if(x!==undefined)h=state(h,x)}let out='';for(let t=0;t<220;t++){const x=sample(h),c=chars[x];if(c==='§'||c==='\n')break;out+=c;h=state(h,x);if(t%15===0)await new Promise(resolve=>setTimeout(resolve,0))}return out.trim()}
function add(text,role){const p=document.createElement('div');p.className='msg '+role;p.textContent=text;chat.append(p);chat.scrollTop=chat.scrollHeight;return p}
document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text||button.disabled)return;input.value='';add(text,'user');button.disabled=true;const pending=add('Text wird erzeugt …','');try{const context=history.slice(-2).map(x=>`Mensch: ${x.q}\nKI: ${x.a}\n§\n`).join('');const reply=await generate(context+`Mensch: ${text.replace(/[\r\n§]/g,' ')}\nKI: `);pending.textContent=reply||'Das Modell hat keinen Text erzeugt. Versuche eine andere Nachricht.';if(reply)history.push({q:text,a:reply})}catch{pending.textContent='Beim Berechnen ist ein Fehler aufgetreten.'}finally{button.disabled=false;chat.scrollTop=chat.scrollHeight;input.focus()}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();document.querySelector('form').requestSubmit()}});
</script></html>
